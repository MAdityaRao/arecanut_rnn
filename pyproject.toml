[project]
name = "arecanut-rnn"
version = "0.1.0"
description = "RNN-based market price forecasting model for Arecanut on Apple Silicon"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.109.2",
    "uvicorn>=0.27.1",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "joblib>=1.3.2",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.3",
    "ipykernel>=6.29.0",
    "tensorflow-macos>=2.14.0",
    "tensorflow-metal>=1.1.0",
]

[tool.uv]
package = false